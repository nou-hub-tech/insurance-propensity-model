[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-mlops"
version = "0.1.0"
description = "Insurance Cross-Sell Prediction MLOps Project"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "dvc==3.51.2",
    "dvc-gdrive==3.0.1",
    "fastapi==0.111.1",
    "imbalanced-learn==0.12.3",
    "joblib==1.4.2",
    "mlflow==2.14.3",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "PyYAML==6.0.1",
    "scikit-learn==1.5.1",
    "uvicorn==0.30.1",
    "prometheus-client==0.20.0",
    "python-dotenv==1.0.1",
    "evidently==0.4.27",
    "tenacity==8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88
